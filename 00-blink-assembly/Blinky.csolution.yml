solution:
  created-by: uv2csolution@1.6.0
  created-for: CMSIS-Toolbox@2.12.0
  compiler: AC6
  target-types:
    - type: STM32F411_Flash
      device: STM32F411CEUx
      optimize: debug
      target-set:
        - set:
          images:
            - image: out/Blinky/STM32F411_Flash/Blinky.axf
            - project-context: Blinky
          debugger:
            name: ST-Link@Arm-Debugger
            clock-armdbg: auto
            protocol-armdbg: auto
    - type: STM32F411_RAM
      device: STM32F411CEUx
      optimize: debug
      target-set:
        - set:
          images:
            - project-context: Blinky
  projects:
    - project: Blinky.cproject.yml
